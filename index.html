<style>
:root {
  --bg: #08080a;
  --bg-2: #0f0f12;
  --card: #18181c;
  --card-2: #212126;
  --line: #2a2a31;
  --text: #ececee;
  --muted: #9a9aa4;
  --dim: #63636c;
  --red: #b8323a;
  --red-soft: rgba(184, 50, 58, 0.16);
  --green: #3fbf6f;
  --green-soft: rgba(63, 191, 111, 0.16);
  --amber: #d9a441;
  --blue: #5b8def;
  --radius: 16px;
  --radius-s: 10px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --font: -apple-system, "Roboto", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
body { padding-bottom: calc(96px + var(--sab)); overscroll-behavior-y: contain; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
a { color: var(--blue); }
::selection { background: var(--red); color: #fff; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- header ---------- */
.top { padding: calc(14px + var(--sat)) calc(16px + var(--sar)) 8px calc(16px + var(--sal)); }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.brand h1 small { display: block; color: var(--dim); font-weight: 500; font-size: 12px; letter-spacing: 0.02em; margin-top: 2px; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--card); color: var(--muted); flex: none; }
.icon-btn:active { background: var(--card-2); }
.icon-btn svg { width: 20px; height: 20px; }

.progress-block { margin-top: 12px; }
.overall { display: flex; align-items: baseline; gap: 8px; }
.overall .num { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.overall .label { color: var(--muted); font-size: 13px; }
.bar { height: 8px; border-radius: 99px; background: var(--card-2); overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; width: 0; background: var(--green); border-radius: 99px; transition: width 0.4s cubic-bezier(.2,.8,.2,1); }
.list-progress { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.lp { background: var(--card); border-radius: var(--radius-s); padding: 10px 12px; }
.lp b { display: block; font-size: 13px; font-weight: 600; }
.lp span { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.lp .bar { height: 5px; margin-top: 6px; }

/* ---------- toolbar ---------- */
.toolbar { position: sticky; top: 0; z-index: 20; background: linear-gradient(var(--bg) 85%, transparent); padding: 6px calc(16px + var(--sar)) 10px calc(16px + var(--sal)); }
.search { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 14px; padding: 0 12px; height: 46px; border: 1px solid transparent; }
.search:focus-within { border-color: var(--line); }
.search svg { width: 18px; height: 18px; color: var(--dim); flex: none; }
.search input { flex: 1; background: none; border: 0; outline: 0; min-width: 0; height: 100%; font-size: 16px; }
.search input::placeholder { color: var(--dim); }
.search .clear { width: 32px; height: 32px; border-radius: 50%; color: var(--muted); }
.controls { display: flex; gap: 8px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; padding-bottom: 2px; }
.controls::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 38px; padding: 0 14px; border-radius: 99px; background: var(--card); color: var(--muted); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; border: 1px solid transparent; }
.chip.on { background: var(--text); color: var(--bg); }
.chip.on.red { background: var(--red); color: #fff; }
.chip.on.green { background: var(--green); color: #05130a; }
.chip svg { width: 15px; height: 15px; }
.chip .badge { background: var(--red); color: #fff; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 99px; }
.chip.on .badge { background: var(--bg); color: var(--text); }
.select-wrap { position: relative; flex: none; }
.select-wrap select { appearance: none; -webkit-appearance: none; height: 38px; border-radius: 99px; background: var(--card); color: var(--muted); border: 0; padding: 0 30px 0 14px; font-size: 14px; font-weight: 500; }
.select-wrap::after { content: ""; position: absolute; right: 13px; top: 15px; border: 4px solid transparent; border-top-color: var(--muted); pointer-events: none; }

/* ---------- lists ---------- */
.lists { padding: 0 calc(16px + var(--sar)) 0 calc(16px + var(--sal)); display: grid; grid-template-columns: 1fr; gap: 20px; }
@media (min-width: 820px) { .lists { grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; } }
.list-head { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 0; text-align: left; min-height: 48px; border-bottom: 1px solid var(--line); }
.list-head .mark { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.list-head h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; flex: 1; }
.list-head .count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.list-head .chev { width: 18px; height: 18px; color: var(--dim); transition: transform 0.25s; }
.list.collapsed .list-head .chev { transform: rotate(-90deg); }
.list.collapsed .cards { display: none; }
.cards { display: grid; gap: 10px; padding-top: 10px; }
.empty { color: var(--dim); font-size: 14px; padding: 18px 4px; text-align: center; }

/* ---------- card ---------- */
.card { background: var(--card); border-radius: var(--radius); overflow: hidden; display: grid; grid-template-columns: 92px 1fr; position: relative; }
.card.watched { box-shadow: inset 3px 0 0 var(--green); }
.card.watching { box-shadow: inset 3px 0 0 var(--amber); }
.card.dropped { opacity: 0.55; }
.poster { width: 92px; aspect-ratio: 2 / 3; background: var(--card-2); position: relative; overflow: hidden; display: flex; align-items: flex-end; }
.poster img { width: 100%; height: 100%; object-fit: cover; display: block; position: absolute; inset: 0; }
.poster .ph { padding: 8px; font-size: 11px; font-weight: 700; line-height: 1.2; color: var(--muted); letter-spacing: -0.01em; word-break: break-word; position: relative; z-index: 1; }
.poster .ph::before { content: ""; position: absolute; left: 8px; top: -6px; width: 22px; height: 2px; background: var(--red); }
.poster .pos { position: absolute; top: 6px; left: 6px; font-size: 10px; font-weight: 700; color: var(--bg); background: var(--muted); padding: 1px 6px; border-radius: 6px; z-index: 2; }
.card .body { padding: 10px 12px 10px 12px; min-width: 0; display: flex; flex-direction: column; gap: 6px; text-align: left; }
.card .open { display: contents; }
.card .title { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; margin: 0; }
.card .title .yr { color: var(--muted); font-weight: 500; }
.meta { color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.scores { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; font-variant-numeric: tabular-nums; }
.score { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 7px; background: var(--card-2); color: var(--muted); }
.score b { color: var(--text); font-weight: 600; }
.score.na b { color: var(--dim); font-weight: 500; }
.dscore { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 7px; background: var(--red-soft); color: #e08c92; font-weight: 700; font-size: 12px; }
.dscore b { font-size: 13px; }
.dscore.d10 { background: var(--red); color: #fff; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 11px; color: var(--muted); background: var(--bg-2); padding: 2px 7px; border-radius: 6px; }
.card .tags .tag:nth-child(n+4) { display: none; }
.card-actions { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 0 10px 10px; }
.watch-btn { height: 48px; border-radius: 12px; background: var(--card-2); color: var(--text); font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.15s, transform 0.1s; letter-spacing: 0.01em; }
.watch-btn:active { transform: scale(0.98); }
.watch-btn.is-watched { background: var(--green); color: #05130a; }
.watch-btn.is-watching { background: var(--amber); color: #1b1200; }
.watch-btn.is-dropped { background: #3a3a42; color: var(--muted); }
.watch-btn svg { width: 18px; height: 18px; }
.more-btn { width: 48px; height: 48px; border-radius: 12px; background: var(--card-2); color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
.more-btn svg { width: 20px; height: 20px; }
.card .mine { font-size: 12px; color: var(--muted); }
.card .mine b { color: var(--amber); }

/* ---------- floating action ---------- */
.fab { position: fixed; right: calc(16px + var(--sar)); bottom: calc(16px + var(--sab)); height: 52px; padding: 0 20px 0 16px; border-radius: 99px; background: var(--red); color: #fff; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 25; }
.fab svg { width: 20px; height: 20px; }
.fab:active { transform: scale(0.97); }

/* ---------- sheet / overlay ---------- */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
.overlay.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: calc(100% - var(--sat) - 12px); background: var(--bg-2); border-radius: 22px 22px 0 0; z-index: 50; transform: translateY(105%); transition: transform 0.28s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; overflow: hidden; }
.sheet.open { transform: translateY(0); }
.sheet .grab { width: 40px; height: 4px; border-radius: 99px; background: var(--line); margin: 10px auto 0; flex: none; }
.sheet .sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px calc(16px + var(--sar)) calc(24px + var(--sab)) calc(16px + var(--sal)); overscroll-behavior: contain; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px calc(16px + var(--sar)) 0 calc(16px + var(--sal)); flex: none; }
.sheet-head h2 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
@media (min-width: 820px) { .sheet { left: 50%; right: auto; width: 680px; transform: translate(-50%, 105%); } .sheet.open { transform: translate(-50%, 0); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- detail ---------- */
.hero { display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: start; }
.hero .poster { width: 120px; border-radius: 12px; }
.hero .poster .ph { font-size: 13px; }
.hero h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
.hero .orig { color: var(--muted); font-size: 13px; margin-top: 2px; }
.hero .meta { margin-top: 8px; }
.hero .listtag { display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 7px; background: var(--card); color: var(--muted); }
.big-watch { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 16px; }
.big-watch button { height: 52px; border-radius: 12px; background: var(--card); color: var(--muted); font-weight: 700; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; line-height: 1; }
.big-watch button svg { width: 18px; height: 18px; }
.big-watch button.on { background: var(--text); color: var(--bg); }
.big-watch button.on[data-status="watched"] { background: var(--green); color: #05130a; }
.big-watch button.on[data-status="watching"] { background: var(--amber); color: #1b1200; }
.big-watch button.on[data-status="dropped"] { background: #4a4a54; color: #fff; }
.section { margin-top: 20px; }
.section h3 { margin: 0 0 8px; font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.02em; }
.section p { margin: 0; color: var(--text); font-size: 15px; line-height: 1.5; }
.score-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.sc { background: var(--card); border-radius: 12px; padding: 10px 6px; text-align: center; }
.sc b { display: block; font-size: 18px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.sc b.na { color: var(--dim); font-size: 15px; }
.sc span { display: block; font-size: 10.5px; color: var(--muted); margin-top: 3px; line-height: 1.15; }
.dbig { display: flex; align-items: center; gap: 14px; background: var(--red-soft); border-radius: 14px; padding: 12px 14px; }
.dbig .n { font-size: 40px; font-weight: 800; letter-spacing: -0.04em; color: #e6959b; line-height: 1; font-variant-numeric: tabular-nums; }
.dbig .n small { font-size: 16px; color: var(--muted); font-weight: 600; letter-spacing: 0; }
.dbig .t { font-size: 14px; color: var(--text); }
.dbig .t span { display: block; color: var(--muted); font-size: 12.5px; }
.blur-box { position: relative; background: var(--card); border-radius: 12px; padding: 12px 14px; overflow: hidden; }
.blur-box p { filter: blur(8px); user-select: none; transition: filter 0.3s; }
.blur-box.revealed p { filter: none; user-select: auto; }
.blur-box .reveal { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.blur-box.revealed .reveal { display: none; }
.reveal button, .btn { height: 44px; padding: 0 18px; border-radius: 12px; background: var(--card-2); color: var(--text); font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.red { background: var(--red); color: #fff; }
.btn.green { background: var(--green); color: #05130a; }
.btn.ghost { background: var(--card); color: var(--muted); }
.btn.wide { width: 100%; }
.btn svg { width: 18px; height: 18px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row .btn { flex: 1; min-width: 130px; }
.field { margin-top: 12px; }
.field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
.field input[type="text"], .field input[type="number"], .field input[type="date"], .field input[type="url"], .field input[type="password"], .field textarea, .field select { width: 100%; background: var(--card); border: 1px solid transparent; border-radius: 12px; padding: 12px 14px; font-size: 16px; outline: 0; min-height: 46px; }
.field textarea { min-height: 90px; resize: vertical; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--line); }
.seg { display: grid; gap: 4px; }
.seg.two { grid-template-columns: 1fr 1fr; }
.seg.ten { grid-template-columns: repeat(10, 1fr); }
.seg button { height: 44px; border-radius: 10px; background: var(--card); color: var(--muted); font-weight: 700; font-size: 14px; }
.seg button.on { background: var(--text); color: var(--bg); }
.seg.stars button.on { background: var(--amber); color: #1b1200; }
.seg.dist button.on { background: var(--red); color: #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips .chip { height: 36px; padding: 0 12px; font-size: 13px; }
.chips .chip.on { background: var(--text); color: var(--bg); }
.help { color: var(--dim); font-size: 12.5px; margin-top: 6px; }
.stamp { color: var(--dim); font-size: 12px; margin-top: 8px; }
details.editor { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 12px; }
details.editor summary { list-style: none; cursor: pointer; font-size: 14px; font-weight: 700; color: var(--muted); min-height: 44px; display: flex; align-items: center; gap: 8px; }
details.editor summary::-webkit-details-marker { display: none; }
details.editor summary::before { content: "▸"; color: var(--dim); }
details.editor[open] summary::before { content: "▾"; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.two-col .field { margin-top: 8px; }

/* ---------- filter sheet ---------- */
.range-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* ---------- stats ---------- */
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.stat { background: var(--card); border-radius: 12px; padding: 12px 14px; }
.stat b { display: block; font-size: 24px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.stat.wide { grid-column: 1 / -1; }
.stat.wide b { font-size: 17px; letter-spacing: -0.01em; }
.stat.wide span.sub { color: var(--dim); }

/* ---------- random ---------- */
.pick { background: var(--card); border-radius: 14px; padding: 14px; margin-top: 14px; display: grid; grid-template-columns: 80px 1fr; gap: 12px; align-items: center; }
.pick .poster { width: 80px; border-radius: 10px; }
.pick h4 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
.pick .meta { margin-top: 4px; }
.pick .btn-row { grid-column: 1 / -1; }

/* ---------- toast ---------- */
.toast { position: fixed; left: 50%; bottom: calc(84px + var(--sab)); transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity 0.2s, transform 0.2s; z-index: 60; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- animations ---------- */
@keyframes pop { 0% { transform: scale(0.96); } 60% { transform: scale(1.03); } 100% { transform: scale(1); } }
.watch-btn.pop { animation: pop 0.3s ease-out; }

/* ---------- iOS Safari fixes ---------- */
button, a, .chip, .card { touch-action: manipulation; }
button { -webkit-appearance: none; appearance: none; }
.search input { -webkit-appearance: none; appearance: none; border-radius: 0; }
.search input::-webkit-search-cancel-button, .search input::-webkit-search-decoration { -webkit-appearance: none; display: none; }
.field input, .field textarea, .field select { -webkit-appearance: none; appearance: none; }
.field input[type="date"] { min-height: 46px; display: block; }
.sheet { max-height: calc(100dvh - var(--sat) - 12px); }

/* iOS zooms the page when a focused control is under 16px */
.select-wrap select { font-size: 16px; }
.field input, .field textarea, .field select, .search input { font-size: 16px; }

</style>

<script>
/* Disturbing Movie Tracker — seed database (50 films, two lists)
   Ratings marked source "seed (approx)" are approximate values recorded from memory.
   Treat them as placeholders: run "Refresh all ratings" with an OMDb/TMDB key, or
   correct them in the editor. null = unknown → shown as N/A. Never invented. */
(function (global) {
  var NA = { score: null, source: null, lastUpdated: null };
  function seed(score) { return score == null ? NA : { score: score, source: "seed (approx)", lastUpdated: null }; }
  function R(imdb, meta, rtc, rta, tmdb) {
    return {
      imdb: seed(imdb),
      metascore: seed(meta),
      rottenTomatoesCritics: seed(rtc),
      rottenTomatoesAudience: seed(rta),
      tmdb: seed(tmdb)
    };
  }
  var A = "original-tiktok-list", B = "vigils-recommendations";
  function M(o) {
    o.alternateTitles = o.alternateTitles || [];
    o.originalTitle = o.originalTitle || o.title;
    o.contentRating = o.contentRating || null;
    o.poster = o.poster || null;
    o.backdrop = null;
    o.tmdbId = null;
    o.imdbId = null;
    o.spoilers = o.spoilers || "";
    o.ratings = o.ratings || R();
    o.watchData = { status: "unwatched", dateWatched: null, personalRating: null, personalDisturbance: null, recommend: null, watchAgain: null, notes: "" };
    return o;
  }

  var MOVIES = [
    /* ===================== LIST A — ORIGINAL TIKTOK LIST ===================== */
    M({ id: "zero-day-2003", title: "Zero Day", year: 2003, list: A, position: 1, director: "Ben Coccio",
      country: ["United States"], runtime: 92, genres: ["Drama", "Crime"], contentRating: "Not rated",
      synopsis: "Two high-school seniors keep a video diary as they plan an attack on their own school, documenting ordinary teenage life alongside their preparations.",
      disturbanceScore: 8, disturbanceTags: ["Found Footage", "Realistic Violence", "Psychological", "Bleak"],
      consensus: "Widely respected as one of the most unsettling school-shooting films because of how ordinary and unremarkable its two leads feel. Praised for restraint; hard to watch precisely because it never sensationalises.",
      whyDisturbing: "Its horror is the banality: the boys are funny, bored and likeable right up until they are not, and the found-footage format makes the ending feel like something you were not supposed to see.",
      ratings: R(6.5) }),

    M({ id: "megan-is-missing-2011", title: "Megan Is Missing", year: 2011, list: A, position: 2, director: "Michael Goi",
      country: ["United States"], runtime: 85, genres: ["Horror", "Drama"], contentRating: "Not rated",
      synopsis: "Told through webcam chats and phone video, two teenage girls meet someone online, and one of them disappears.",
      disturbanceScore: 9, disturbanceTags: ["Found Footage", "Child Abuse", "Sexual Violence", "Realistic Violence", "Bleak"],
      consensus: "Poorly reviewed as a conventional film, with wooden acting and a preachy first hour, but infamous online because of its final twenty minutes, which many viewers describe as genuinely traumatic. A cautionary-tale film that became a dare.",
      whyDisturbing: "The last act abandons the film's clumsy tone entirely and shows the consequences of the abduction in prolonged, unblinking detail. The subject matter involves minors, which is what makes it so widely regarded as difficult.",
      ratings: R(4.9) }),

    M({ id: "exhibit-a-2007", title: "Exhibit A", year: 2007, list: A, position: 3, director: "Dom Rotheroe",
      country: ["United Kingdom"], runtime: 85, genres: ["Drama", "Thriller"], contentRating: "Not rated",
      synopsis: "A teenage girl's new camcorder records her ordinary Yorkshire family as her father's secret pressures slowly push the household toward collapse.",
      disturbanceScore: 8, disturbanceTags: ["Found Footage", "Family Trauma", "Realistic Violence", "Psychological", "Bleak"],
      consensus: "A little-seen British found-footage drama that earns strong word of mouth for its slow, believable build. Viewers who find it tend to describe it as one of the more quietly devastating entries in the format.",
      whyDisturbing: "It plays like real home video of a real family, and the dread comes from watching a decent-seeming man crack under money pressure while nobody around him quite notices in time.",
      ratings: R() }),

    M({ id: "long-pigs-2007", title: "Long Pigs", year: 2007, list: A, position: 4, director: "Chris Power, Nathan Hynes",
      country: ["Canada"], runtime: 80, genres: ["Horror", "Mockumentary"], contentRating: "Not rated",
      synopsis: "Two documentary filmmakers follow a friendly, articulate man who happens to kill and eat people, recording his methods and his philosophy.",
      disturbanceScore: 7, disturbanceTags: ["Found Footage", "Cannibalism", "Serial Killer", "Realistic Violence", "Psychological"],
      consensus: "A cult micro-budget mockumentary compared often to Man Bites Dog. Admired for a disarmingly likeable lead performance and a matter-of-fact tone that makes the gruesome parts land harder than the budget suggests.",
      whyDisturbing: "The killer is charming and reasonable, the butchery is shown as routine work, and the film keeps asking how complicit the camera crew (and the viewer) has become.",
      ratings: R() }),

    M({ id: "lake-mungo-2008", title: "Lake Mungo", year: 2008, list: A, position: 5, director: "Joel Anderson",
      country: ["Australia"], runtime: 87, genres: ["Horror", "Drama", "Mystery"], contentRating: "R",
      synopsis: "Presented as a documentary, a family tries to make sense of the drowning of their teenage daughter and the strange events that follow.",
      disturbanceScore: 6, disturbanceTags: ["Found Footage", "Family Trauma", "Existential", "Psychological"],
      consensus: "Frequently named among the best mockumentary horror films ever made. Not gory or violent at all; its reputation rests on grief, a deeply sad atmosphere, and one image many viewers say they cannot shake.",
      whyDisturbing: "The dread is emotional rather than physical. It is about a family learning how little they knew their daughter, and about facing what is waiting for you, and it lingers for days.",
      ratings: R(6.3) }),

    M({ id: "sorgoi-prakov-2013", title: "Sorgoi Prakov", alternateTitles: ["Descent Into Darkness: My European Nightmare", "Sorgoi Prakov, My European Dream"],
      year: 2013, list: A, position: 6, director: "Rafael Cherkaski", country: ["France"], runtime: null, genres: ["Horror"], contentRating: "Not rated",
      synopsis: "A young Eastern European man arrives in Paris to film a hopeful documentary about the 'European dream' and instead records his own moral and mental disintegration.",
      disturbanceScore: 9, disturbanceTags: ["Found Footage", "Sexual Violence", "Realistic Violence", "Psychological", "Bleak", "Extreme Horror"],
      consensus: "An underground French found-footage film with a fierce reputation among extreme-horror communities. Praised for an unnervingly committed lead performance, criticised for how far it goes in its back half.",
      whyDisturbing: "It starts almost sweet and then follows its protagonist all the way down. The second half contains sustained, degrading violence presented as raw footage with no relief.",
      ratings: R() }),

    M({ id: "reel-2-2020", title: "Reel 2", year: 2020, list: A, position: 7, director: "Chris Goodwin",
      country: ["Canada"], runtime: 104, genres: ["Horror", "Thriller"], contentRating: "Not rated",
      synopsis: "The faceless killer-filmmaker from Reel returns, this time hunting for the perfect actress to star in his sequel, and the footage is presented as his finished film.",

      consensus: "A self-released Canadian found-footage sequel known mostly inside the underground horror scene. Fans praise its meta framing and creepy narrator; it is deliberately gruelling in stretches and is not built for casual viewers.",
      whyDisturbing: "The conceit is that a murderer edited this for you. The stalking is patient, the violence is presented as home video, and the killer's voice-over treats it as art.",
      ratings: R() }),

    M({ id: "killing-ground-2016", title: "Killing Ground", year: 2016, list: A, position: 8, director: "Damien Power",
      country: ["Australia"], runtime: 88, genres: ["Horror", "Thriller"], contentRating: "Not rated",
      synopsis: "A couple's camping trip to a remote riverside spot intersects, across two timelines, with the fate of a family who camped there before them.",
      disturbanceScore: 8, disturbanceTags: ["Realistic Violence", "Sexual Violence", "Bleak", "Family Trauma"],
      consensus: "Well reviewed as a tight, unusually well-acted Australian outback thriller. Its structure is clever, but the reputation comes from a grim realism about what happens to the family, which many viewers found harder than any slasher.",

      ratings: R(5.8) }),

    M({ id: "kidnapped-2010", title: "Kidnapped", alternateTitles: ["Secuestrados"], originalTitle: "Secuestrados", year: 2010, list: A, position: 9, director: "Miguel Ángel Vivas",
      country: ["Spain"], runtime: 85, genres: ["Horror", "Thriller"], contentRating: "Not rated",
      synopsis: "On their first night in a new house, a family of three is taken hostage by masked men, and the film follows the ordeal in a handful of long unbroken takes.",
      disturbanceScore: 8, disturbanceTags: ["Home Invasion", "Realistic Violence", "Bleak", "Family Trauma"],
      consensus: "Admired for its technical daring (twelve long takes, split screen) and despised by some for its nihilism. Widely considered one of the bleakest home-invasion films; the ending is the reason it is on lists like this.",
      whyDisturbing: "Real time and no cuts mean no escape for the viewer either. The final minutes are abrupt, ugly and offer nothing to hold on to.",

    M({ id: "landmine-goes-click-2015", title: "Landmine Goes Click", year: 2015, list: A, position: 10, director: "Levan Bakhia",
      country: ["Georgia", "United States"], runtime: 110, genres: ["Thriller", "Horror"], contentRating: "Not rated",
      synopsis: "Hiking in the Georgian countryside, an American steps on a landmine, and a stranger who wanders by decides to use the situation rather than help.",
      disturbanceScore: 8, disturbanceTags: ["Psychological", "Sexual Violence", "Revenge", "Bleak", "Realistic Violence"],
      consensus: "Mixed reviews as a film but a strong reputation for cruelty. The first half is a tense single-location standoff, and the second half turns into something much nastier and more morally bankrupt than viewers expect.",
      whyDisturbing: "The premise traps a man into watching what he cannot stop, and the film then extends that helplessness into a revenge story where nobody is redeemable.",
      ratings: R(6.2) }),

    M({ id: "red-white-and-blue-2010", title: "Red, White & Blue", year: 2010, list: A, position: 11, director: "Simon Rumley",
      country: ["United States", "United Kingdom"], runtime: 104, genres: ["Drama", "Horror", "Thriller"], contentRating: "Not rated",
      synopsis: "In Austin, Texas, a promiscuous young woman, a damaged veteran, and an aspiring musician are drawn together in a chain of decisions that ends in vengeance.",
      disturbanceScore: 8, disturbanceTags: ["Revenge", "Torture", "Bleak", "Psychological", "Realistic Violence"],
      consensus: "Critically respected as a slow, character-driven American indie that turns into an unbearable revenge film in its final act. Praised for its performances; often described as emotionally punishing rather than just gory.",
      whyDisturbing: "It spends an hour making you care about broken people, then shows exactly what one of them is capable of. The violence is intimate and personal rather than spectacular.",
      ratings: R(6.3) }),

    M({ id: "the-living-and-the-dead-2006", title: "The Living and the Dead", year: 2006, list: A, position: 12, director: "Simon Rumley",
      country: ["United Kingdom"], runtime: 83, genres: ["Drama", "Horror"], contentRating: "Not rated",
      synopsis: "In a crumbling English manor, a mentally ill young man decides he alone can care for his bedridden mother after his father leaves, and stops taking his medication.",
      disturbanceScore: 7, disturbanceTags: ["Psychological", "Family Trauma", "Bleak", "Existential"],
      consensus: "A little-seen British psychological drama with a devoted cult following. Reviewers highlight a frantic, committed lead performance and a sense of decay; it is disturbing through mental collapse rather than gore.",

      var m = byId(b.dataset.toggle); var next = m.watchData.status === "watched" ? "unwatched" : "watched";
      setWatch(m.id, { status: next }); renderAll();
      var nb = $('[data-toggle="' + m.id + '"]'); if (nb) nb.classList.add("pop");
      toast(next === "watched" ? "✓ " + m.title + " watched" : m.title + " marked not watched");
    } else if (b.dataset.open) openDetail(b.dataset.open);
    else if (b.dataset.collapse) { state.settings.collapsed[b.dataset.collapse] = !state.settings.collapsed[b.dataset.collapse]; save(); renderLists(); }
  });
  $("#search").addEventListener("input", function (e) { query = e.target.value.trim().toLowerCase(); $("#search-clear").classList.toggle("hidden", !query); renderLists(); });
  $("#search-clear").addEventListener("click", function () { $("#search").value = ""; query = ""; $("#search-clear").classList.add("hidden"); renderLists(); $("#search").focus(); });
  $("#sort").addEventListener("change", function (e) { sortKey = e.target.value; renderLists(); });
  $$(".chip[data-quick]").forEach(function (c) { c.addEventListener("click", function () { filters.status = filters.status === c.dataset.quick ? "all" : c.dataset.quick; renderLists(); }); });
  $("#btn-filter").addEventListener("click", function () { renderFilter(); show("sheet-filter"); });
  $("#btn-stats").addEventListener("click", function () { renderStats(); show("sheet-stats"); });
  $("#btn-random").addEventListener("click", function () { renderRandom(); show("sheet-random"); });
  $("#btn-settings").addEventListener("click", function () { renderSettings(); show("sheet-settings"); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") hide(); });

  /* swipe-down on the grab handle closes a sheet */
  var sy = null;
  document.addEventListener("touchstart", function (e) { var g = e.target.closest(".grab, .sheet-head"); sy = g ? e.touches[0].clientY : null; }, { passive: true });
  document.addEventListener("touchend", function (e) { if (sy != null && e.changedTouches[0].clientY - sy > 60) hide(); sy = null; }, { passive: true });

  /* ---------------- init ---------------- */
  load(); build();
  $("#brand-sub").textContent = movies.length + " films across " + window.LISTS.length + " lists";
  renderAll();
  setTimeout(function () { autoFetchPosters(true); }, 600);
  if ("serviceWorker" in navigator && location.protocol !== "file:") { navigator.serviceWorker.register("service-worker.js").catch(function () {}); }
  window.DMT = { movies: function () { return movies; }, state: state, filters: filters, passes: passes, sorter: sorter, pickMovie: pickMovie, setWatch: setWatch, build: build };
})();

</script>
</body>
</html>
